# 部署示例：复制为 summary_config.toml 后填写私有参数。
# 此文件可提交；实际配置不可提交。已有配置请勿覆盖。
# AI 默认关闭，填写专用 LiteLLM Key、地址和模型名称后再启用。
# summary_scope_ai_enabled：启用此 AI 调用点
# summary_scope_ai_api_key：此调用点专用 LiteLLM 虚拟 Key
# summary_scope_ai_base_url：LiteLLM 接口地址
# summary_scope_ai_model_name：LiteLLM 模型名称
# summary_scope_ai_request_timeout_seconds：单次请求超时（秒）
# summary_scope_ai_response_max_tokens：范围识别输出 token 上限

summary_scope_ai_enabled = false
summary_scope_ai_api_key = ""
summary_scope_ai_base_url = ""
summary_scope_ai_model_name = ""
summary_scope_ai_request_timeout_seconds = 60.0
summary_scope_ai_response_max_tokens = 500
