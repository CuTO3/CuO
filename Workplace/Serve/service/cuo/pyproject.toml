[project]
name = "cuo-backend"
version = "0.1.0"
description = "CuO group assistant: durable PostgreSQL tasks and OneBot reverse WebSocket"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary,pool]>=3.2,<4", "python-dotenv>=1,<2", "openpyxl>=3.1,<4", "jieba>=0.42.1", "regex>=2024.11", "Pillow>=11"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ops/tests"]
pythonpath = ["src/backend", "."]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/backend"]
include = ["Core*", "Function*", "Integration*", "Workflow*"]
