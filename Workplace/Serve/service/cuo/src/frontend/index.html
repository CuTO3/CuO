 <aside class="sidebar"><a class="brand" href="#overview"><div class="brand-mark">Cu<span>O</span></div><div><strong>氧化铜</strong><small>CuO CONTROL CENTER</small></div></a><div class="workspace-label">工作空间</div><nav id="nav"></nav><div class="sidebar-bottom"><div class="connection"><i id="connection-dot" class="dot"></i><div><strong id="connection-text">正在连接</strong><small>CuCl · 私有服务器</small></div></div><button id="logout" class="logout">退出登录 <span>↗</span></button></div></aside>
 <main><header class="topbar"><span>工作空间 <b>/</b> <span id="breadcrumb">总览</span></span><div class="top-actions"><span id="updated">同步中</span><button id="refresh" class="icon-button" aria-label="刷新数据">↻</button><span class="avatar">Cu</span></div></header><div class="page"><div class="page-heading"><div><p id="page-eyebrow" class="eyebrow">AT A GLANCE</p><h1 id="page-title">每一刻，都在掌握。</h1><p id="page-subtitle" class="muted">让繁杂留在幕后，让日常轻盈有序。</p></div><label class="group-picker">当前群组<select id="group" aria-label="当前群组"></select></label></div><div id="notice" class="notice hidden" role="alert"></div><div id="content" aria-live="polite"></div><footer><span><strong>CuO</strong> 为每一段对话，留一点心意。</span><span>Asia / Shanghai <i class="footer-dot">·</i> 控制中心 1.0</span></footer></div></main>
